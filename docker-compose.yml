services:
  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: homebuh_php
    volumes:
      - ./source/app:/srv/www/homebuh
    expose:
      - 9000
    depends_on:
      - "mysql"
      - "redis"
    environment:
      - MYSQL_HOST=mysql

  nginx:
    build:
      context: ./docker/nginx
    container_name: homebuh_nginx
    command: bash -c "exec nginx -g 'daemon off;'"
    volumes:
      - ./source/app:/srv/www/homebuh
    working_dir: /srv/www/homebuh
    ports:
      - 82:80
    depends_on:
      - "php-fpm"
  redis:
    container_name: homebuh_redis
    image: redis:6-alpine
    ports:
      - 6379:6379

  mysql:
    container_name: homebuh_mysql
    image: percona/percona-server:5.7
    env_file: ./source/app/.env
    command: "--default-authentication-plugin=mysql_native_password --disable-log-bin --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    volumes:
      - homebuh-mysql:/var/lib/mysql
    ports:
    - 3308:3306
    user: mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      # Matches the database name in DATABASE_URL. Only takes effect when the
      # homebuh-mysql volume is empty: the entrypoint skips all initialization on
      # an already-populated data directory.
      - MYSQL_DATABASE=homebuh
      # Account for GUI clients (PhpStorm, DataGrip). The app itself connects as
      # root over the internal network, but JDBC drivers handle empty-password
      # accounts badly, so tooling gets a real password. The entrypoint creates
      # this user and grants it ALL on MYSQL_DATABASE.
      - MYSQL_USER=homebuh
      - MYSQL_PASSWORD=homebuh

volumes:
  homebuh-mysql: